<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>上传测试站 · MOSS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>📦 MOSS 上传测试站</h1>
      <p class="sub">多文件发布链路测试站点</p>
    </div>
    <div id="cfgStatus" class="chip">检测中…</div>
  </header>

  <nav>
    <button id="tab-dl" class="tab active" type="button">📤 下载页（免费）</button>
    <button id="tab-up" class="tab" type="button">🔒 上传页（需指令）</button>
  </nav>

  <!-- ================= 下载页：完全免费 ================= -->
  <section id="view-dl" class="view active">
    <h2>全部文件 <span id="dlCount" class="count"></span></h2>
    <p class="hint">下载页完全免费、无需任何指令，所有人都能下载。</p>
    <div id="dlList" class="list"></div>
  </section>

  <!-- ================= 上传页：需要指令 ================= -->
  <section id="view-up" class="view">
    <div id="gate">
      <h2>🔒 输入指令解锁上传</h2>
      <p class="hint">只有知道正确指令的人才能往这个站上传文件。</p>
      <div class="row">
        <input id="pwd" type="password" placeholder="输入指令…" autocomplete="off">
        <button id="unlock" class="btn primary" type="button">解锁</button>
      </div>
      <div id="gateMsg" class="msg"></div>
    </div>

    <div id="panel" class="hidden">
      <h2>📤 上传文件</h2>
      <div id="drop" class="drop">
        <b>点击选择文件</b>（可多选）或把文件拖到这里
        <input id="file" type="file" multiple hidden>
      </div>
      <div id="upMsg" class="msg"></div>
      <h3>已上传 <span id="upCount" class="count"></span></h3>
      <div id="upList" class="list"></div>
      <p class="hint">说明：这是纯前端测试站，上传的文件只保存在你浏览器的
        localStorage 里（本机），不会真的传到服务器——用来测试多文件站点的发布与渲染链路。</p>
    </div>
  </section>

  <footer>多文件测试站点：index.html + style.css + script.js · 用于测试 MOSS 浏览器多文件发布</footer>
</div>
<script src="script.js"></script>
</body>
</html>
